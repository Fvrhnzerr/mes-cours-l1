# Reconstruit et publie le Drive Universitaire à chaque modification du dépôt.
# À placer dans : .github/workflows/site.yml
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:   # bouton « Run workflow » pour relancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt (avec l'historique, pour le badge « Nouveau »)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer index.html
        run: python maj.py

      - name: Préparer la publication
        uses: actions/configure-pages@v5

      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
